# Engine build cruise for the Toqraq Godot fork.
#
# Detects upstream stable tags without a fork build, checks them out with
# modules/toqraq/ (already committed in-tree), builds editor binaries, and
# publishes a fork release with SHA256-SUMS.txt.

name: engine-build

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to build (e.g. 4.7.1-stable); empty = auto-detect"
        required: false
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add upstream and list stable tags
        id: pick
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/godotengine/godot.git || true
          git fetch upstream --tags
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            candidates="${{ inputs.upstream_tag }}"
          else
            candidates=$(git tag -l '*-stable' --sort=-v:refname | head -n 5)
          fi
          out="[]"
          for tag in $candidates; do
            release_tag="${tag}-toqraq"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              echo "skip $tag (release exists)"
              continue
            fi
            out=$(jq -c --arg t "$tag" '. + [$t]' <<<"$out")
          done
          echo "tags=$out" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: plan
    if: fromJSON(needs.plan.outputs.tags) != fromJSON('[]')
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
        platform: [windows, linuxbsd]
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create engine branch at upstream tag
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/godotengine/godot.git || true
          git fetch upstream --depth 1 "refs/tags/${{ matrix.tag }}"
          branch="toqraq/${{ matrix.tag }}"
          if git show-ref --verify --quiet "refs/heads/$branch"; then
            git checkout "$branch"
          else
            git checkout -b "$branch" FETCH_HEAD
            git checkout master -- modules/toqraq
            git add modules/toqraq
            git commit -m "chore: toqraq module at ${{ matrix.tag }}"
          fi

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: scons platform=windows target=editor arch=x86_64 production=yes -j $env:NUMBER_OF_PROCESSORS

      - name: Build (Linux)
        if: matrix.platform == 'linuxbsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libxi-dev libxrandr-dev libwayland-dev
          scons platform=linuxbsd target=editor arch=x86_64 production=yes -j "$(nproc)"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.tag }}"
          version="${version%-stable}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            exe="bin/godot.windows.editor.x86_64.exe"
            asset="Godot_v${version}-stable_win64.exe.zip"
            inner="Godot_v${version}-stable_win64.exe"
          else
            exe="bin/godot.linuxbsd.editor.x86_64"
            asset="Godot_v${version}-stable_linux.x86_64.zip"
            inner="Godot_v${version}-stable_linux.x86_64"
          fi
          test -f "$exe"
          mkdir -p out
          cp "$exe" "out/$inner"
          (cd out && zip -9 "$asset" "$inner" && sha256sum "$asset" > sums.txt)
          echo "asset=out/$asset" >> "$GITHUB_OUTPUT"
          echo "inner=$inner" >> "$GITHUB_OUTPUT"

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.tag }}-${{ matrix.platform }}
          path: |
            ${{ steps.package.outputs.asset }}
            out/sums.txt
          retention-days: 7

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: engine-${{ matrix.tag }}-*
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          set -euo pipefail
          cat dist/*/sums.txt > SHA256-SUMS.txt 2>/dev/null || cat dist/sums.txt > SHA256-SUMS.txt
          assets=$(find dist -name '*.zip')
          gh release create "${{ matrix.tag }}-toqraq" \
            --title "Toqraq engine ${{ matrix.tag }}" \
            --notes "Upstream ${{ matrix.tag }} + modules/toqraq. Official-protocol compatible; adds the toqraq: debug capture." \
            $assets SHA256-SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
